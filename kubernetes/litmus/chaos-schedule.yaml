apiVersion: litmuschaos.io/v1alpha1
kind: ChaosSchedule
metadata:
  name: nightly-chaos-schedule
  namespace: litmus
spec:
  schedule:
    type: "repeat"
    startTime: "2024-11-01T02:00:00Z"
    endTime: "2024-11-30T04:00:00Z"
    minChaosInterval:
      hour:
        everyNthHour: 24
        minuteOfHour: 0
  engineTemplateSpec:
    appinfo:
      appns: 'default'
      applabel: 'app in (cart-service,payment-service)'
      appkind: 'deployment'
    annotationCheck: 'true'
    engineState: 'active'
    chaosServiceAccount: litmus-admin
    monitoring: true
    jobCleanUpPolicy: 'delete'
    experiments:
      - name: pod-delete
        spec:
          components:
            env:
              - name: TOTAL_CHAOS_DURATION
                value: '600'
              - name: CHAOS_INTERVAL
                value: '60'
              - name: PODS_AFFECTED_PERC
                value: '20'
