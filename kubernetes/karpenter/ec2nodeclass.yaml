apiVersion: karpenter.k8s.aws/v1beta1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2
  role: whitefriday-karpenter-node
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: whitefriday-prod
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: whitefriday-prod
  amiSelectorTerms:
    - alias: "al2@1.29"
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 100Gi
        volumeType: gp3
        iops: 3000
        encrypted: true
  detailedMonitoring: true
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required
